[project]
name = "gopro-garmin-overlay-designer"
version = "0.1.0"
description = "A local Windows visual designer for GoPro and Garmin telemetry video overlays"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
  "gopro-overlay==0.134.0",
]

[project.urls]
Upstream = "https://github.com/time4tea/gopro-dashboard-overlay"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
