name: Bug report
description: Report a reproducible Overlay Designer problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach access tokens, private GPS tracks, personal videos or unredacted logs.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: encoder
    attributes:
      label: Encoder
      options:
        - CPU libx264
        - NVIDIA NVENC
        - NVIDIA CUDA overlay
        - Intel QSV
        - AMD AMF
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use sanitized paths and data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      render: text
